name: New packages RSS

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout overlay
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout RSS generator
        uses: actions/checkout@v6
        with:
          repository: vitaly-zdanevich/gentoo-overlay-new-packages-to-rss
          path: generator

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate RSS
        run: |
          cargo run --release --manifest-path generator/Cargo.toml -- \
            --repo . \
            --repo-url "https://github.com/${{ github.repository }}" \
            --output "public/${GITHUB_REPOSITORY#*/}.rss"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
