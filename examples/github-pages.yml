name: New packages RSS

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  GENERATOR_VERSION: v0.1.0
  GENERATOR_TARGET: x86_64-unknown-linux-gnu

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout overlay
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download RSS generator
        run: |
          archive="gentoo-overlay-new-packages-to-rss-${GENERATOR_TARGET}.tar.gz"
          base="https://github.com/vitaly-zdanevich/gentoo-overlay-new-packages-to-rss/releases/download/${GENERATOR_VERSION}"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/${archive}.sha256"
          sha256sum -c "${archive}.sha256"
          tar -xzf "${archive}"
          chmod +x gentoo-overlay-new-packages-to-rss

      - name: Generate RSS
        run: |
          ./gentoo-overlay-new-packages-to-rss \
            --repo . \
            --repo-url "https://github.com/${{ github.repository }}" \
            --output "public/${GITHUB_REPOSITORY#*/}.rss"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
