name: New packages RSS

on:
  push:
    branches:
      - master
    paths:
      - "*/*/metadata.xml"
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  GENERATOR_VERSION: v0.6.0
  GENERATOR_BINARY: gentoo-overlay-new-packages-to-rss-linux-x86_64

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout overlay
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for added package metadata
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          after="${{ github.sha }}"

          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-status --diff-filter=A "$before" "$after" -- '*/*/metadata.xml' | grep -q .; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download RSS generator
        if: steps.changes.outputs.should_run == 'true'
        run: |
          base="https://github.com/vitaly-zdanevich/gentoo-overlay-new-packages-to-rss/releases/download/${GENERATOR_VERSION}"
          curl -fsSLO "${base}/${GENERATOR_BINARY}"
          curl -fsSLO "${base}/${GENERATOR_BINARY}.sha256"
          sha256sum -c "${GENERATOR_BINARY}.sha256"
          chmod +x "${GENERATOR_BINARY}"

      - name: Generate RSS
        if: steps.changes.outputs.should_run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%/*}"
          ./${GENERATOR_BINARY} \
            --repo . \
            --repo-url "https://github.com/${{ github.repository }}" \
            --self-url "https://${owner}.github.io/${repo}/${repo}.rss" \
            --github-author-links \
            --output "public/${repo}.rss"
          printf '%s\n' \
            '<!doctype html>' \
            '<meta charset="utf-8">' \
            "<title>${repo} new packages RSS</title>" \
            "<a href=\"./${repo}.rss\">${repo}.rss</a>" \
            > public/index.html
          touch public/.nojekyll

      - name: Configure Pages
        if: steps.changes.outputs.should_run == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.changes.outputs.should_run == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy Pages
        if: steps.changes.outputs.should_run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
