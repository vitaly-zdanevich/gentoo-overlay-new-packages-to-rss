name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      BIN: gentoo-overlay-new-packages-to-rss
      TARGET: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - name: Package
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/$BIN" "dist/$BIN-$TARGET"
          cd dist
          sha256sum "$BIN-$TARGET" | tee "$BIN-$TARGET.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          gh release upload "$GITHUB_REF_NAME" "dist/$BIN-$TARGET" "dist/$BIN-$TARGET.sha256" --clobber
