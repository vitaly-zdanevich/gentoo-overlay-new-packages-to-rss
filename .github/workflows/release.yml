name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      BIN: gentoo-overlay-new-packages-to-rss
      TARGET_X86_64: x86_64-unknown-linux-gnu
      TARGET_ARM64: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - name: Install ARM64 linker
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Test
        run: cargo test --locked

      - name: Build x86_64
        run: cargo build --release --locked --target "$TARGET_X86_64"

      - name: Build ARM64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target "$TARGET_ARM64"

      - name: Package
        run: |
          mkdir -p dist
          cp "target/$TARGET_X86_64/release/$BIN" "dist/$BIN-linux-x86_64"
          cp "target/$TARGET_ARM64/release/$BIN" "dist/$BIN-linux-arm64"
          cd dist
          sha256sum "$BIN-linux-x86_64" | tee "$BIN-linux-x86_64.sha256"
          sha256sum "$BIN-linux-arm64" | tee "$BIN-linux-arm64.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
